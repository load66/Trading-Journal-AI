services:
  - type: web
    name: trading-journal-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: DATABASE_MODE
        value: postgres
      - key: STORAGE_MODE
        value: supabase
      - key: FRONTEND_ORIGINS
        value: https://load66.github.io
      - key: SUPABASE_URL
        sync: false
      - key: AUTHORIZED_USER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: diary
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
