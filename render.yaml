services:
  - type: web
    name: trading-journal-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DATABASE_MODE
        value: turso
      - key: STORAGE_MODE
        value: supabase
      - key: FRONTEND_ORIGINS
        value: https://load66.github.io
      - key: SUPABASE_STORAGE_BUCKET
        value: trading-journal-diary
      - key: ALPACA_DATA_FEED
        value: iex
      - key: AUTHORIZED_USER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
