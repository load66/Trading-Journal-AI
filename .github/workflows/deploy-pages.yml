name: Deploy GitHub Pages

on:
  push:
    branches: [main, feature/web-deployment-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate public deployment variables
        env:
          API_URL: ${{ vars.REACT_APP_API_URL }}
          SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$API_URL" || { echo "Missing REACT_APP_API_URL repository variable"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing REACT_APP_SUPABASE_URL repository variable"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "Missing REACT_APP_SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npx craco test --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          PUBLIC_URL: /Trading-Journal-AI
          REACT_APP_AUTH_REQUIRED: "true"
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
