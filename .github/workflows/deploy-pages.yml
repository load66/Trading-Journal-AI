name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages frontend
    if: >-
      ${{ vars.REACT_APP_API_URL != '' &&
          vars.REACT_APP_SUPABASE_URL != '' &&
          vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npx craco test --watchAll=false

      - name: Build private hosted frontend
        working-directory: frontend
        env:
          PUBLIC_URL: /Trading-Journal-AI
          REACT_APP_AUTH_ENABLED: "true"
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
